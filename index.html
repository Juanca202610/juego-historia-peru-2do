<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Aventura por la Historia del Perú</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Trebuchet MS,Arial;background:linear-gradient(#55c9ff,#e8fbff);color:#2b1b12;overflow-x:hidden}.sky{position:fixed;inset:0;z-index:-2;background:linear-gradient(#42baf4 0 50%,#83d766 50% 100%)}.cloud{position:fixed;width:150px;height:50px;border-radius:50px;background:#fff;opacity:.8;animation:cloud 22s linear infinite;z-index:-1}.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}.cloud:before{width:65px;height:65px;left:25px;top:-30px}.cloud:after{width:80px;height:80px;left:65px;top:-38px}@keyframes cloud{from{left:-180px}to{left:105vw}}header{text-align:center;padding:18px;background:#ffffffcc;border-bottom:6px solid #d63230}h1{margin:0;color:#d63230;font-size:clamp(32px,5vw,64px);text-shadow:2px 2px #fff}.sub{font-size:20px;font-weight:bold}.worlds{max-width:1180px;margin:24px auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:15px;padding:0 15px}.card{border:4px solid #fff;border-radius:22px;padding:14px;box-shadow:0 8px 18px #0004;min-height:250px;text-align:center;cursor:pointer;transition:.2s;background:#fff}.card:hover{transform:translateY(-8px) scale(1.02)}.card h2{font-size:22px}.ico{height:130px;position:relative;overflow:hidden;border-radius:18px;background:linear-gradient(#7fd9ff,#9ee27b)}.sun{position:absolute;width:55px;height:55px;border-radius:50%;background:#ffd52b;right:12px;top:10px;box-shadow:0 0 20px #ffd52b;animation:pulse 1.5s infinite}.mount{position:absolute;bottom:-5px;left:5%;width:90%;height:80px;background:#638e48;clip-path:polygon(0 100%,20% 30%,35% 70%,55% 10%,75% 60%,100% 20%,100% 100%)}.person{position:absolute;bottom:12px;left:42%;font-size:62px;animation:bob 1.3s ease-in-out infinite}.boat{position:absolute;bottom:20px;left:10px;font-size:70px;animation:sail 4s ease-in-out infinite alternate}.flag{position:absolute;bottom:15px;left:40%;font-size:75px;transform-origin:left bottom;animation:wave .8s ease-in-out infinite alternate}.train{position:absolute;bottom:12px;left:5px;font-size:75px;animation:train 4s linear infinite}.pot{position:absolute;bottom:10px;left:38%;font-size:70px;animation:bob 1.3s infinite}.time{position:absolute;bottom:10px;left:38%;font-size:70px;animation:spin 4s linear infinite}@keyframes bob{50%{transform:translateY(-9px)}}@keyframes pulse{50%{transform:scale(1.12)}}@keyframes sail{to{left:55%}}@keyframes wave{to{transform:rotate(7deg)}}@keyframes train{from{left:-20%}to{left:90%}}@keyframes spin{to{transform:rotate(360deg)}}button{border:0;border-radius:14px;padding:11px 18px;background:#1d9b45;color:#fff;font-size:18px;font-weight:bold;cursor:pointer}.panel{display:none;max-width:900px;margin:20px auto 50px;background:#fff;border-radius:25px;padding:24px;box-shadow:0 8px 25px #0005}.panel.show{display:block}.q{font-size:28px;font-weight:bold;margin:15px 0}.answers{display:grid;gap:10px}.ans{background:#f1f7ff;color:#222;border:3px solid #87baf5;text-align:left}.ans:hover{background:#dcecff}.scene{height:230px;border-radius:20px;position:relative;overflow:hidden;background:linear-gradient(#6fd0ff,#8fd36d);margin:10px 0}.big{position:absolute;font-size:110px;left:45%;bottom:20px;animation:bob 1s infinite}.feedback{font-size:24px;font-weight:bold;min-height:35px;margin:12px 0}.score{position:fixed;right:15px;top:15px;background:#fff;border-radius:18px;padding:10px 15px;font-weight:bold;z-index:4;box-shadow:0 4px 10px #0003}.small{font-size:16px;color:#555}
.visual{position:absolute;inset:0;overflow:hidden}.label{position:absolute;left:14px;top:12px;background:#fffde8dd;padding:7px 12px;border-radius:14px;font-weight:800;font-size:18px;z-index:4}.desert{position:absolute;inset:45% 0 0;background:#d9a85c}.nazca-svg{position:absolute;left:15%;top:25%;width:70%;height:65%;filter:drop-shadow(0 2px 1px #8c642e)}.nazca-path{fill:none;stroke:#f8e1a5;stroke-width:7;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1400;stroke-dashoffset:1400;animation:drawline 4.5s linear infinite}.cloth{position:absolute;width:210px;height:120px;left:calc(50% - 105px);bottom:35px;border-radius:12px;background:repeating-linear-gradient(45deg,#b52b37 0 18px,#f0b63a 18px 36px,#243f87 36px 54px);animation:unroll 2s ease-in-out infinite alternate;box-shadow:0 8px 12px #0003}.stone{position:absolute;left:42%;bottom:20px;font-size:105px;animation:stoneup 1.7s ease-in-out infinite alternate}.huaco{position:absolute;left:43%;bottom:20px;font-size:105px;animation:turnpot 2.5s ease-in-out infinite}.lake{position:absolute;left:0;right:0;bottom:0;height:42%;background:linear-gradient(#39aeea,#1678b5);animation:water 2s ease-in-out infinite alternate}.pair{position:absolute;left:37%;bottom:45px;font-size:82px;animation:walkpair 3s ease-in-out infinite alternate}.city{position:absolute;left:28%;bottom:18px;font-size:92px;animation:zoomcity 2.2s ease-in-out infinite alternate}.sunbig{position:absolute;right:70px;top:45px;font-size:95px;animation:sunglow 1.4s ease-in-out infinite alternate}.map{position:absolute;left:35%;bottom:22px;font-size:100px;animation:mapfloat 2s ease-in-out infinite alternate}.king{position:absolute;left:42%;bottom:20px;font-size:100px;animation:bob 1.2s infinite}.metals{position:absolute;left:30%;bottom:25px;font-size:85px;animation:sparkle 1.1s ease-in-out infinite alternate}.ship{position:absolute;bottom:35px;left:-10%;font-size:100px;animation:sailfull 5s linear infinite}.liberator{position:absolute;left:38%;bottom:20px;font-size:105px;animation:hero 1.5s ease-in-out infinite alternate}.battle{position:absolute;left:28%;bottom:25px;font-size:90px;animation:charge 2.5s ease-in-out infinite alternate}.ballot{position:absolute;left:40%;bottom:25px;font-size:105px;animation:vote 2s ease-in-out infinite}.rail{position:absolute;left:-15%;bottom:20px;font-size:100px;animation:railgo 4.5s linear infinite}.timeline{position:absolute;left:8%;right:8%;top:48%;height:10px;background:#6b3d1d;border-radius:10px}.timeline-icons{position:absolute;left:8%;right:8%;top:28%;display:flex;justify-content:space-between;font-size:58px}.timeline-icons span{animation:bob 1.4s ease-in-out infinite}.timeline-icons span:nth-child(2){animation-delay:.2s}.timeline-icons span:nth-child(3){animation-delay:.4s}.timeline-icons span:nth-child(4){animation-delay:.6s}.timeline-icons span:nth-child(5){animation-delay:.8s}
@keyframes drawline{0%{stroke-dashoffset:1400}70%,100%{stroke-dashoffset:0}}@keyframes unroll{from{transform:scaleX(.45) rotate(-2deg)}to{transform:scaleX(1) rotate(2deg)}}@keyframes stoneup{to{transform:translateY(-18px) scale(1.05)}}@keyframes turnpot{50%{transform:rotateY(180deg) translateY(-8px)}}@keyframes water{to{transform:translateY(6px)}}@keyframes walkpair{to{transform:translateX(70px) translateY(-8px)}}@keyframes zoomcity{to{transform:scale(1.15)}}@keyframes sunglow{to{transform:scale(1.18) rotate(8deg);filter:drop-shadow(0 0 18px #ffd600)}}@keyframes mapfloat{to{transform:translateY(-12px) rotate(3deg)}}@keyframes sparkle{to{transform:scale(1.13);filter:drop-shadow(0 0 12px gold)}}@keyframes sailfull{to{left:85%}}@keyframes hero{to{transform:translateY(-10px) rotate(-2deg)}}@keyframes charge{to{transform:translateX(70px)}}@keyframes vote{50%{transform:translateY(-15px) rotate(4deg)}}@keyframes railgo{to{left:88%}}@keyframes zoomcity{to{transform:scale(1.13)}}
</style></head><body><div class=sky></div><div class=cloud style="top:100px"></div><div class=cloud style="top:220px;animation-delay:-11s"></div><div class=score>⭐ <span id=sc>0</span></div><header><h1>🇵🇪 Aventura por la Historia del Perú</h1><div class=sub>2.º de primaria · Todos los mundos están desbloqueados</div><div class=small>Contenido basado en el temario escolar compartido y contrastado con materiales educativos peruanos.</div></header><main><div class=worlds id=worlds></div><section class=panel id=panel><button onclick="closeP()">← Volver a los mundos</button><h2 id=title></h2><div class=scene id=scene><div class=visual id=visual></div></div><button onclick="speak()">🔊 Escuchar pregunta</button><div class=q id=q></div><div class=answers id=answers></div><div class=feedback id=fb></div><button id=next onclick="nextQ()" style="display:none">Siguiente ➜</button></section></main><script>
const data=[
{n:'Culturas preincas',e:'🏺',qs:[['¿Qué cultura destacó por sus construcciones y esculturas de piedra?',['Chavín','Paracas','Nazca'],0],['¿Qué cultura es conocida por sus mantos y trepanaciones craneanas?',['Mochica','Paracas','Chavín'],1],['¿Qué cultura realizó las famosas Líneas de Nazca?',['Nazca','Chavín','Mochica'],0],['¿Qué cultura destacó por sus huacos y cerámica?',['Mochica','Paracas','Nazca'],0]]},
{n:'Imperio incaico',e:'🦙',qs:[['¿Cómo se llamó el gran territorio gobernado por los incas?',['Tahuantinsuyo','Virreinato','República'],0],['Según la leyenda, ¿quiénes salieron del lago Titicaca?',['Manco Cápac y Mama Ocllo','San Martín y Bolívar','Ramón Castilla y la Coya'],0],['¿Cuál fue la capital del Tahuantinsuyo?',['Lima','Cusco','Nazca'],1],['¿Qué lengua fue muy importante en el Tahuantinsuyo?',['Quechua','Inglés','Francés'],0],['¿A qué dios rendían especial culto los incas?',['Inti, el Sol','Neptuno','Zeus'],0]]},
{n:'Virreinato',e:'⛵',qs:[['¿Quién gobernaba el Virreinato en representación del rey de España?',['El virrey','El presidente','El inca'],0],['¿Qué metales fueron muy importantes para la economía colonial?',['Oro y plata','Aluminio y titanio','Solo cobre'],0],['¿Qué ocurrió antes del Virreinato del Perú?',['La conquista del Tahuantinsuyo','La República','La proclamación de 1821'],0]]},
{n:'Independencia',e:'🇵🇪',qs:[['¿Quién proclamó la Independencia del Perú el 28 de julio de 1821?',['José de San Martín','Ramón Castilla','Manco Cápac'],0],['¿Cómo se llamó José Gabriel Condorcanqui?',['Túpac Amaru II','Pachacútec','Atahualpa'],0],['¿Qué personaje contribuyó a consolidar la independencia del Perú?',['Simón Bolívar','Virrey Toledo','Cristóbal Colón'],0],['¿Qué batallas de 1824 fueron decisivas para consolidar la independencia?',['Junín y Ayacucho','Arica y Tarapacá','Lima y Cusco'],0]]},
{n:'República',e:'🚂',qs:[['¿En qué etapa de la historia del Perú vivimos actualmente?',['República','Virreinato','Tahuantinsuyo'],0],['En una república democrática, ¿cómo llegan las autoridades al gobierno?',['Mediante elecciones','Por herencia de un rey','Por ser nobles'],0],['¿Qué presidente es recordado por la abolición de la esclavitud en el Perú?',['Ramón Castilla','José de San Martín','Manco Cápac'],0]]},
{n:'Máquina del tiempo',e:'⏳',qs:[['Ordena mentalmente: ¿qué etapa ocurrió primero?',['Culturas preincas','Virreinato','República'],0],['¿Qué etapa viene después del Imperio incaico y la conquista española?',['Virreinato','República','Culturas preincas'],0],['¿Qué hecho marca tradicionalmente el inicio de la etapa republicana?',['La Independencia','Las Líneas de Nazca','La fundación legendaria del Cusco'],0]]}
];
const visuals=[
[
`<div class="label">Chavín: trabajo en piedra</div><div class="sun"></div><div class="mount"></div><div class="stone">🗿</div>`,
`<div class="label">Paracas: hermosos mantos</div><div class="sun"></div><div class="mount"></div><div class="cloth"></div>`,
`<div class="label">Líneas de Nasca: el colibrí se dibuja</div><div class="desert"></div><svg class="nazca-svg" viewBox="0 0 500 260"><path class="nazca-path" d="M35 145 C90 125 110 100 150 85 C120 120 110 145 125 175 C145 145 165 120 205 108 C185 135 180 165 205 190 C230 155 245 130 280 118 C265 150 275 180 315 202 C300 160 315 130 350 105 C335 145 355 165 410 155 C375 140 350 115 335 80 C325 110 305 125 280 118 C245 95 215 80 175 70 C145 60 110 65 80 80 C105 82 125 88 150 85"/></svg>`,
`<div class="label">Mochica: cerámica y huacos</div><div class="sun"></div><div class="mount"></div><div class="huaco">🏺</div>`],
[
`<div class="label">El Tahuantinsuyo</div><div class="sun"></div><div class="mount"></div><div class="map">🗺️</div>`,
`<div class="label">Según la leyenda: lago Titicaca</div><div class="sun"></div><div class="mount"></div><div class="lake"></div><div class="pair">🧑🏽‍🌾👩🏽‍🌾</div>`,
`<div class="label">Cusco, capital del Tahuantinsuyo</div><div class="sun"></div><div class="mount"></div><div class="city">🏛️</div>`,
`<div class="label">Quechua</div><div class="sun"></div><div class="mount"></div><div class="pair">🗣️📜</div>`,
`<div class="label">Inti, el Sol</div><div class="mount"></div><div class="sunbig">☀️</div><div class="pair">🙏🏽</div>`],
[
`<div class="label">El virrey representaba al rey de España</div><div class="sun"></div><div class="mount"></div><div class="king">👑</div>`,
`<div class="label">Oro y plata</div><div class="sun"></div><div class="mount"></div><div class="metals">🪙✨🪙</div>`,
`<div class="label">Conquista española</div><div class="lake"></div><div class="ship">⛵</div>`],
[
`<div class="label">28 de julio de 1821</div><div class="sun"></div><div class="mount"></div><div class="liberator">🧑🏻‍✈️🇵🇪</div>`,
`<div class="label">José Gabriel Condorcanqui: Túpac Amaru II</div><div class="sun"></div><div class="mount"></div><div class="liberator">🧑🏽‍🦱</div>`,
`<div class="label">Simón Bolívar</div><div class="sun"></div><div class="mount"></div><div class="liberator">🐎🧑🏻‍✈️</div>`,
`<div class="label">Junín y Ayacucho · 1824</div><div class="sun"></div><div class="mount"></div><div class="battle">🐎 🇵🇪 🐎</div>`],
[
`<div class="label">El Perú vive en la etapa republicana</div><div class="sun"></div><div class="mount"></div><div class="liberator">🇵🇪🏛️</div>`,
`<div class="label">Elegimos autoridades mediante el voto</div><div class="sun"></div><div class="mount"></div><div class="ballot">🗳️</div>`,
`<div class="label">Ramón Castilla · abolición de la esclavitud</div><div class="sun"></div><div class="mount"></div><div class="rail">🚂</div>`],
[
`<div class="label">Viaja por la historia</div><div class="timeline"></div><div class="timeline-icons"><span>🏺</span><span>🦙</span><span>⛵</span><span>🇵🇪</span><span>🏛️</span></div>`,
`<div class="label">Después de los incas y la conquista: Virreinato</div><div class="timeline"></div><div class="timeline-icons"><span>🦙</span><span>➡️</span><span>⛵</span></div>`,
`<div class="label">Independencia → República</div><div class="timeline"></div><div class="timeline-icons"><span>🇵🇪</span><span>➡️</span><span>🏛️</span></div>`]
];
let wi=0,qi=0,score=0,speaking=false;const worlds=document.getElementById('worlds');
data.forEach((w,i)=>{let c=document.createElement('div');c.className='card';let anim=w.e==='⛵'?'boat':w.e==='🇵🇪'?'flag':w.e==='🚂'?'train':w.e==='⏳'?'time':w.e==='🏺'?'pot':'person';c.innerHTML=`<div class=ico><div class=sun></div><div class=mount></div><div class=${anim}>${w.e}</div></div><h2>${i+1}. ${w.n}</h2><button>JUGAR ▶</button>`;c.onclick=()=>openW(i);worlds.appendChild(c)});
function openW(i){wi=i;qi=0;worlds.style.display='none';panel.classList.add('show');render()};function closeP(){speechSynthesis.cancel();panel.classList.remove('show');worlds.style.display='grid'}
function render(){speechSynthesis.cancel();let w=data[wi],x=w.qs[qi];title.textContent=w.n;visual.innerHTML=visuals[wi][qi];q.textContent=x[0];answers.innerHTML='';fb.textContent='';next.style.display='none';x[1].forEach((a,j)=>{let b=document.createElement('button');b.className='ans';b.textContent=String.fromCharCode(65+j)+'. '+a;b.onclick=()=>answer(j,b);answers.appendChild(b)});setTimeout(speak,450)}
function answer(j,b){speechSynthesis.cancel();[...answers.children].forEach(x=>x.disabled=true);let x=data[wi].qs[qi];if(j===x[2]){score+=10;sc.textContent=score;fb.textContent='🌟 ¡Muy bien! Respuesta correcta: '+x[1][x[2]]+'.';fb.style.color='green';tone(700);sayFeedback('¡Muy bien! La respuesta correcta es '+x[1][x[2]]+'.')}else{fb.textContent='💡 Casi. La respuesta correcta es: '+x[1][x[2]]+'.';fb.style.color='#c0392b';tone(220);sayFeedback('Casi. La respuesta correcta es '+x[1][x[2]]+'.')}next.style.display='inline-block'}
function nextQ(){qi++;if(qi>=data[wi].qs.length){fb.textContent='🏆 ¡Mundo completado!';setTimeout(closeP,1000)}else render()}
function speak(){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(data[wi].qs[qi][0]+' '+data[wi].qs[qi][1].map((x,i)=>String.fromCharCode(65+i)+', '+x).join('. '));u.lang='es-PE';u.rate=.88;let vs=speechSynthesis.getVoices();u.voice=vs.find(v=>v.lang.toLowerCase().startsWith('es-pe'))||vs.find(v=>v.lang.toLowerCase().startsWith('es'))||null;speechSynthesis.speak(u)}
function sayFeedback(t){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='es-PE';u.rate=.88;let vs=speechSynthesis.getVoices();u.voice=vs.find(v=>v.lang.toLowerCase().startsWith('es-pe'))||vs.find(v=>v.lang.toLowerCase().startsWith('es'))||null;speechSynthesis.speak(u)}
function tone(f){let A=new (window.AudioContext||window.webkitAudioContext)(),o=A.createOscillator(),g=A.createGain();o.frequency.value=f;o.connect(g);g.connect(A.destination);g.gain.setValueAtTime(.12,A.currentTime);g.gain.exponentialRampToValueAtTime(.001,A.currentTime+.25);o.start();o.stop(A.currentTime+.25)}
</script></body></html>
